name: CI for ML Docker App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        cd app
        pip install -r requirements.txt

    - name: Run a simple test (import app)
      run: |
        cd app
        python -c "import app"

    - name: Run tests with pytest
      run: |
        cd app
        pip install pytest
        pytest

    - name: Build Docker image
      run: |
        cd app
        docker build -t my-ml-docker-app:latest .
