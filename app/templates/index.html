<!DOCTYPE html>
<html>
<head>
    <title>Iris Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            display: flex;
            gap: 20px;
        }
        #main {
            flex: 2;
        }
        #historyPanel {
            flex: 1;
            border-left: 2px solid #ddd;
            padding-left: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }
        input {
            margin: 5px;
            padding: 8px;
            width: 150px;
        }
        button {
            padding: 8px 16px;
            margin-top: 10px;
        }
        table {
            margin-top: 30px;
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #aaa;
            padding: 8px;
            text-align: center;
        }
        h2, h3 {
            margin-top: 40px;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #4caf50;
            background-color: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
            width: fit-content;
        }
    </style>
</head>
<body>
    <div id="main">
        <h2>🌸 Iris Flower Prediction</h2>
        <form id="predictForm">
            <input name="feature1" placeholder="Sepal Length" required>
            <input name="feature2" placeholder="Sepal Width" required>
            <input name="feature3" placeholder="Petal Length" required>
            <input name="feature4" placeholder="Petal Width" required><br>
            <button type="submit">Predict</button>
        </form>

        <div id="result"></div>

        <h3>🔍 Sample Inputs (Click to Autofill)</h3>
        <table>
            <thead>
                <tr>
                    <th>Sepal Length</th>
                    <th>Sepal Width</th>
                    <th>Petal Length</th>
                    <th>Petal Width</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Sample inputs (Setosa, Versicolor, Virginica) -->
                <tr><td>5.1</td><td>3.5</td><td>1.4</td><td>0.2</td><td><button type="button" onclick="fill(5.1,3.5,1.4,0.2)">Use</button></td></tr>
                <tr><td>6.0</td><td>2.2</td><td>4.0</td><td>1.0</td><td><button type="button" onclick="fill(6.0,2.2,4.0,1.0)">Use</button></td></tr>
                <tr><td>7.0</td><td>3.2</td><td>4.7</td><td>1.4</td><td><button type="button" onclick="fill(7.0,3.2,4.7,1.4)">Use</button></td></tr>
                <tr><td>5.5</td><td>2.5</td><td>4.0</td><td>1.3</td><td><button type="button" onclick="fill(5.5,2.5,4.0,1.3)">Use</button></td></tr>
                <tr><td>6.3</td><td>3.3</td><td>6.0</td><td>2.5</td><td><button type="button" onclick="fill(6.3,3.3,6.0,2.5)">Use</button></td></tr>
                <tr><td>4.9</td><td>3.1</td><td>1.5</td><td>0.1</td><td><button type="button" onclick="fill(4.9,3.1,1.5,0.1)">Use</button></td></tr>
                <tr><td>6.7</td><td>3.1</td><td>4.7</td><td>1.5</td><td><button type="button" onclick="fill(6.7,3.1,4.7,1.5)">Use</button></td></tr>
                <tr><td>5.8</td><td>2.7</td><td>5.1</td><td>1.9</td><td><button type="button" onclick="fill(5.8,2.7,5.1,1.9)">Use</button></td></tr>
                <tr><td>7.2</td><td>3.6</td><td>6.1</td><td>2.5</td><td><button type="button" onclick="fill(7.2,3.6,6.1,2.5)">Use</button></td></tr>
                <tr><td>6.4</td><td>2.9</td><td>4.3</td><td>1.3</td><td><button type="button" onclick="fill(6.4,2.9,4.3,1.3)">Use</button></td></tr>
            </tbody>
        </table>
    </div>

    <div id="historyPanel">
        <h3>📜 Prediction History</h3>
        <button id="loadHistoryBtn">Load History</button>
        <div id="historyContent">No history loaded.</div>
    </div>

<script>
    function fill(f1, f2, f3, f4) {
        document.querySelector("input[name='feature1']").value = f1;
        document.querySelector("input[name='feature2']").value = f2;
        document.querySelector("input[name='feature3']").value = f3;
        document.querySelector("input[name='feature4']").value = f4;
    }

    document.getElementById('predictForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent form from submitting normally

        // Collect inputs as numbers
        const features = [
            parseFloat(this.feature1.value),
            parseFloat(this.feature2.value),
            parseFloat(this.feature3.value),
            parseFloat(this.feature4.value)
        ];

        // Call your API with JSON payload
        fetch('/predict', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({features: features})
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                document.getElementById('result').innerText = "Error: " + data.error;
            } else {
                document.getElementById('result').innerHTML =
                    `Prediction: <b>${data.prediction}</b><br>` +
                    `Confidence: <b>${data.confidence}</b>`;
            }
        })
        .catch(err => {
            document.getElementById('result').innerText = 'Error: ' + err;
        });
    });

    // Load history on button click
    document.getElementById('loadHistoryBtn').addEventListener('click', () => {
        fetch('/history')
            .then(res => res.json())
            .then(data => {
                if (data.prediction_history && data.prediction_history.length > 0) {
                    const rows = data.prediction_history.map(pred => {
                        return `<tr>
                            <td>${pred.features.join(', ')}</td>
                            <td>${pred.prediction}</td>
                            <td>${pred.confidence}</td>
                        </tr>`;
                    }).join('');
                    document.getElementById('historyContent').innerHTML =
                        `<table>
                            <thead>
                                <tr>
                                    <th>Features</th><th>Prediction</th><th>Confidence</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>`;
                } else {
                    document.getElementById('historyContent').innerText = 'No prediction history found.';
                }
            })
            .catch(() => {
                document.getElementById('historyContent').innerText = 'Failed to load history.';
            });
    });
</script>

</body>
</html>
